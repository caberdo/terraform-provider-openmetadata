version: 2

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "deps"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # One PR per run instead of one per module: the module graph is small and
    # the whole bump is validated by the same test job anyway.
    groups:
      go-modules:
        patterns:
          - "*"

  # The stack mixes the test toolchain with the server under test. Only `golang`
  # may move: the OpenMetadata image tag is driven by
  # .github/openmetadata-versions.txt, and Elasticsearch must stay on the version
  # the pinned server was tested with. An automated bump to either would silently
  # change what the acceptance suite runs against.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "deps"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    allow:
      - dependency-name: "golang"
    groups:
      test-toolchain:
        patterns:
          - "golang"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "deps"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
