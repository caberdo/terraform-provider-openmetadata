# CI is delegated to the reusable workflows in caberdo/terraform-provider-kit.
#
# The triggers, the concurrency group and the token scopes stay here: a
# `workflow_call` file cannot declare triggers, and a called workflow can only
# narrow the token its caller grants. Everything else — the job steps, the
# versions-matrix parser, the coverage gate — lives in the kit.
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: caberdo/terraform-provider-kit/.github/workflows/provider-ci.yml@v0.15.0
    # GitHub validates a caller's grant against every job of the called workflow
    # before any `if:` or input is evaluated, so these are the union of what
    # provider-ci declares, not what this run happens to execute:
    #
    # - `contents: write` + `pull-requests: write`: requested unconditionally by
    #   the called `docs` job. Omitting them rejects the whole run with "The
    #   nested job 'docs' is requesting 'contents: write, pull-requests: write'"
    #   — even though the job only renders the drift check here.
    # - `security-events: write`: the `Lint & Security` job uploads gosec SARIF
    #   to code scanning.
    #
    # This does not widen the token any other job runs with: every other job in
    # provider-ci.yml re-declares `contents: read` (and nothing else), and a
    # called job can narrow the caller's grant, never widen it.
    permissions:
      contents: write
      pull-requests: write
      security-events: write
    with:
      provider: openmetadata
      provider-display: OpenMetadata
      module: github.com/caberdo/terraform-provider-openmetadata
      packages: ./internal/...
      # The matrix source of truth, named here so it cannot drift from the
      # acceptance call below.
      versions-file: .github/openmetadata-versions.txt
      # There is no version file: the newest CHANGELOG.md section names the
      # version, and a merge is not a release. `changelog: true` runs the check
      # that compares that section with the README install constraint and
      # reports the last tag beside the verdict (pending release / released),
      # so a release pull request passes; `tfkit release check` runs the same
      # check locally.
      changelog: true
      # Every pull request that can change what a user sees carries a fragment
      # in changelog.d/ instead of editing CHANGELOG.md.
      changelog-fragments: true
      # This repository does not run govulncheck today; `none` keeps the
      # Vulnerability Scan job as an explicit no-op instead of adding a scan.
      govuln-mode: none
      # The module now requires Go 1.27.4, so the kit's default gosec (v2.30.0)
      # builds here; v2.29.0 could not parse the newer export data.
      # The prebuilt v2.15.0 binary is what this repository ran before; building
      # it with the module toolchain is not needed here.
      golangci-install-mode: binary
      # `docs-mode: drift` keeps the generate-and-diff check in the docs job,
      # whose name the kit fixes at v0.7.0 (it used to be a caller input), so
      # the required context is now `ci / Generate Docs`. The untracked-file
      # check catches a new entity adding a file under docs/ that `git diff`
      # misses.
      docs: true
      docs-mode: drift
      docs-untracked-check: true
      docs-drift-in-test: false
      # The old Docs job also ran the Markdown link checker; it is a separate
      # job in the kit, wired to the same config file.
      markdown: true
      # Re-check the coverage sentence in README.md from the Test job. Its
      # `make coverage-gate` wording is tfkit's default, so the check needs no
      # flag and guards the one line the kit migration changed.
      coverage-readme-in-test: true
      # Keeps the Coverage section of the job summary byte-identical.
      coverage-note: "Unit tests only: acceptance tests require `TF_ACC` and a live OpenMetadata server."

  # The old `acceptance` job ran after `test`; a caller cannot express
  # `needs.<job>.result` across a reusable-workflow boundary, so `needs: ci` is
  # the only faithful spelling: a failing or skipped `ci` skips acceptance,
  # exactly as a failing `test` did before.
  acceptance:
    needs: ci
    uses: caberdo/terraform-provider-kit/.github/workflows/provider-acceptance.yml@v0.15.0
    permissions:
      contents: read
    with:
      provider: openmetadata
      provider-display: OpenMetadata
      packages: ./internal/...
      versions-file: .github/openmetadata-versions.txt
      version-env: OPENMETADATA_VERSION
      # `expect-version-env` stays empty: docker-compose.yml passes
      # OPENMETADATA_EXPECT_VERSION to the test container from the same value.
      # Elasticsearch refuses to start at the distribution default for
      # vm.max_map_count.
      raise-max-map-count: true
      acceptance-timeout: 40
