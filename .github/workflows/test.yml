name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --config .golangci.yml

      # gosec v2.30.0 requires Go 1.26; setup-go pins GOTOOLCHAIN=local and the
      # module declares Go 1.25.8, so use the newest gosec that builds with the
      # module toolchain instead of letting the scanner drift ahead of it.
      - name: Run Gosec Security Scanner
        id: gosec
        continue-on-error: true
        run: |
          go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 \
            -fmt sarif -out gosec.sarif -exclude-dir=vendor -tests=false ./

      - name: Upload security scan results
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles('gosec.sarif') != ''
        with:
          sarif_file: gosec.sarif

      - name: Fail on Gosec findings
        if: always() && steps.gosec.outcome == 'failure'
        run: |
          {
            echo "## Gosec Security Scanner Found Issues"
            echo ""
            if [ -f gosec.sarif ]; then
              echo "| Rule | File | Line | Description |"
              echo "|------|------|------|-------------|"
              jq -r '.runs[0].results[] | "| \(.ruleId) | \(.locations[0].physicalLocation.artifactLocation.uri) | \(.locations[0].physicalLocation.region.startLine) | \(.message.text) |"' gosec.sarif
            fi
            echo ""
            echo "See the **Security** tab for full details."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # One supported Go version: the one go.mod declares, read directly by
  # setup-go. There is no matrix, so this job reports exactly one status check
  # named "Test"; the main-protection ruleset requires that name, and a matrix
  # would report "Test (<version>)" and silently stop matching after a Go bump.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Build and vet
        run: |
          go build ./...
          go vet ./...

      - name: Verify go.mod is tidy and module hashes match
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify

      - name: Cross-platform build
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.9"
          terraform_wrapper: false

      - name: Validate examples
        env:
          REQUIRE_TERRAFORM: "1"
        run: ./scripts/validate-examples.sh

      - name: Run tests with the race detector
        run: go test -v -race -covermode=atomic -coverprofile=coverage.out ./internal/...

      - name: Coverage summary
        if: always()
        run: |
          if [[ ! -f coverage.out ]]; then
            echo "No coverage profile: the test step failed before writing one." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Coverage"
            echo ""
            echo "Unit tests only: acceptance tests require \`TF_ACC\` and a live OpenMetadata server."
            echo ""
            ./scripts/coverage-summary.sh coverage.out
          } >> "$GITHUB_STEP_SUMMARY"
          ./scripts/coverage-summary.sh coverage.out

      # Enforce the coverage floor on every pull request: the `Test` job is a
      # required context, so a regression below .github/coverage-baseline.txt
      # fails the PR instead of only surfacing on main/merge-queue.
      - name: Coverage gate (unit)
        if: always()
        run: ./scripts/coverage-gate.sh coverage.out

      # The badge and floor statement in README.md must track the same baseline
      # the gate enforces; `make coverage-readme` rewrites them.
      - name: Coverage README is in sync
        run: ./scripts/coverage-readme.sh --check

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      # tfplugindocs reads the provider schema through terraform.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.9"
          terraform_wrapper: false

      - name: Regenerate documentation
        run: go generate ./...

      - name: Check generated docs are committed
        run: |
          git diff --exit-code -- docs/
          # A new entity adds a new file under docs/; git diff does not see it.
          test -z "$(git status --porcelain -- docs/)"

      - name: Validate Markdown links
        uses: tcort/github-action-markdown-link-check@e047c5b37f24ab722bbef1a27b6fab7f96bc4068 # v1.1.3
        with:
          config-file: "./.github/github-action-markdown-link-check-config.json"

  acceptance:
    name: Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      # The acceptance container writes coverage-acceptance.out into the mounted
      # worktree; the unit profile is produced here so both can be merged into
      # the one statement-coverage number the project publishes.
      - name: Unit-test coverage
        run: go test -count=1 -skip '^TestAcc' -covermode=atomic -coverprofile=coverage.out ./internal/...

      # The image tags and the expected /system/version value all come from one
      # file, so a version bump cannot update some of them and miss the others.
      - name: Read the pinned OpenMetadata version
        run: echo "OPENMETADATA_VERSION=$(tr -d '[:space:]' < .github/openmetadata-versions.txt)" >> "$GITHUB_ENV"

      # Elasticsearch refuses to start when vm.max_map_count is the distribution
      # default (65530). The podman-backed local run already has 262144.
      - name: Raise vm.max_map_count for Elasticsearch
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Run acceptance tests
        run: docker compose run --rm test

      # Without this, a failed service exits with a bare "didn't complete
      # successfully: exit 1" and the server log is lost with the runner.
      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs --no-color > "openmetadata-${OPENMETADATA_VERSION}.log" || true

      - name: Upload stack logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openmetadata-${{ env.OPENMETADATA_VERSION }}-logs
          path: openmetadata-*.log
          if-no-files-found: ignore

      - name: Tear down the acceptance environment
        if: always()
        run: docker compose down -v

      - name: Combined coverage (unit + acceptance)
        if: always()
        run: |
          if [[ ! -f coverage.out || ! -f coverage-acceptance.out ]]; then
            echo "Incomplete coverage profiles: unit \`coverage.out\` and acceptance" >> "$GITHUB_STEP_SUMMARY"
            echo "\`coverage-acceptance.out\` are both required; one is missing." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          ./scripts/merge-coverage.sh coverage-union.out coverage.out coverage-acceptance.out
          {
            echo "## Coverage (unit + acceptance)"
            echo ""
            echo "\`coverage.out\` and \`coverage-acceptance.out\` merged by \`scripts/merge-coverage.sh\`."
            echo ""
            ./scripts/coverage-summary.sh coverage-union.out
          } >> "$GITHUB_STEP_SUMMARY"

      # Acceptance coverage is reported, not gated: it depends on Docker and a
      # live server, so the enforced floor is the unit profile produced by the
      # `Test` job.
      - name: Upload combined coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-acceptance
          path: |
            coverage-acceptance.out
            coverage-union.out
          if-no-files-found: ignore
