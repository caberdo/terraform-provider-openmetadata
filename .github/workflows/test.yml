name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --config .golangci.yml

      # gosec v2.30.0 requires Go 1.26; setup-go pins GOTOOLCHAIN=local and the
      # module declares Go 1.25.8, so use the newest gosec that builds with the
      # module toolchain instead of letting the scanner drift ahead of it.
      - name: Run Gosec Security Scanner
        id: gosec
        continue-on-error: true
        run: |
          go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 \
            -fmt sarif -out gosec.sarif -exclude-dir=vendor -tests=false ./

      - name: Upload security scan results
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles('gosec.sarif') != ''
        with:
          sarif_file: gosec.sarif

      - name: Fail on Gosec findings
        if: always() && steps.gosec.outcome == 'failure'
        run: |
          {
            echo "## Gosec Security Scanner Found Issues"
            echo ""
            if [ -f gosec.sarif ]; then
              echo "| Rule | File | Line | Description |"
              echo "|------|------|------|-------------|"
              jq -r '.runs[0].results[] | "| \(.ruleId) | \(.locations[0].physicalLocation.artifactLocation.uri) | \(.locations[0].physicalLocation.region.startLine) | \(.message.text) |"' gosec.sarif
            fi
            echo ""
            echo "See the **Security** tab for full details."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # The Trino provider matrixes acceptance over server versions. OpenMetadata is
  # pinned to one version in .github/openmetadata-version.txt, so the only
  # dimension worth matrixing is Go, and there is exactly one supported version:
  # the one go.mod declares.
  prepare:
    name: Prepare Go Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.read.outputs.versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the Go version into a JSON array
        id: read
        run: |
          version="$(awk '$1 == "go" { print $2; exit }' go.mod)"
          if [[ -z "$version" ]]; then
            echo "no go directive found in go.mod" >&2
            exit 1
          fi
          echo "versions=[\"$version\"]" >> "$GITHUB_OUTPUT"
          echo "Matrix: Go $version"

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - lint
      - prepare
    strategy:
      fail-fast: false
      matrix:
        go: ${{ fromJSON(needs.prepare.outputs.versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Build and vet
        run: |
          go build ./...
          go vet ./...

      - name: Verify go.mod is tidy and module hashes match
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify

      - name: Cross-platform build
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.9"
          terraform_wrapper: false

      - name: Validate examples
        env:
          REQUIRE_TERRAFORM: "1"
        run: ./scripts/validate-examples.sh

      - name: Run tests with the race detector
        run: go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      # tfplugindocs reads the provider schema through terraform.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.9"
          terraform_wrapper: false

      - name: Regenerate documentation
        run: go generate ./...

      - name: Check generated docs are committed
        run: |
          git diff --exit-code -- docs/
          # A new entity adds a new file under docs/; git diff does not see it.
          test -z "$(git status --porcelain -- docs/)"

  acceptance:
    name: Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image tags and the expected /system/version value all come from one
      # file, so a version bump cannot update some of them and miss the others.
      - name: Read the pinned OpenMetadata version
        run: echo "OPENMETADATA_VERSION=$(tr -d '[:space:]' < .github/openmetadata-versions.txt)" >> "$GITHUB_ENV"

      # Elasticsearch refuses to start when vm.max_map_count is the distribution
      # default (65530). The podman-backed local run already has 262144.
      - name: Raise vm.max_map_count for Elasticsearch
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Run acceptance tests
        run: docker compose run --rm test

      # Without this, a failed service exits with a bare "didn't complete
      # successfully: exit 1" and the server log is lost with the runner.
      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs --no-color > "openmetadata-${OPENMETADATA_VERSION}.log" || true

      - name: Upload stack logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openmetadata-${{ env.OPENMETADATA_VERSION }}-logs
          path: openmetadata-*.log
          if-no-files-found: ignore

      - name: Tear down the acceptance environment
        if: always()
        run: docker compose down -v
