# Monitors the OpenMetadata maintenance window: compares the supported matrix
# with the upstream releases, canaries the newest release the matrix does not
# cover, and checks this repository's kit pin. Each job reports at most one
# labelled issue and closes it when the finding goes away. The workflow never
# edits the matrix or the pin: the bump stays a decision.
#
# The canary is meant to run weekly, but one caller cannot bind two cron
# schedules to different jobs, and a second workflow file is deliberately out
# of scope here. It therefore runs on this monthly schedule for now; split it
# out (or gate the jobs on `github.event.schedule`) when weekly matters.
name: Version maintenance

on:
  schedule:
    # Monthly, on the first day at 06:00 UTC.
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  freshness:
    uses: caberdo/terraform-provider-kit/.github/workflows/provider-freshness.yml@v0.14.0
    # `issues: write` opens or updates one labelled issue per category;
    # `actions: read` lets the canary report read the failing job's log.
    permissions:
      contents: read
      issues: write
      actions: read
    with:
      provider-display: OpenMetadata
      versions-file: .github/openmetadata-versions.txt
      upstream: open-metadata/OpenMetadata
      # Stable releases are tagged `2.0.8-release` while the matrix holds bare
      # `1.13.6`: no `v` prefix, a literal `-release` suffix. Without stripping
      # it the comparison can never match and the canary asks for an image tag
      # that does not exist. `2.1.0-rc2-release` is a prerelease and is skipped.
      strip-v: false
      strip-suffix: "-release"
      canary: true
      version-env: OPENMETADATA_VERSION
      # Empty on purpose: docker-compose.yml passes OPENMETADATA_EXPECT_VERSION
      # to the test container from the same version the suite reads.
      expect-version-env: ""
      # Elasticsearch refuses to start at the distribution default for
      # vm.max_map_count.
      raise-max-map-count: true
      kit-check: true
